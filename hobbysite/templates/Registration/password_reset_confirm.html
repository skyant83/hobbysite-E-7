{% extends 'base.html' %}

{% block title %}Password Reset{% endblock %}
{% block header %}Change Password{% endblock %}
{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Change password">
    </form>
{% else %}
    <p>
    Invalid password reset link!
    </p>
{% endif %}
