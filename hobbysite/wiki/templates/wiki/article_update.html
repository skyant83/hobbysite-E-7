{% extends 'base_with_login.html' %}
{% load static %}
{% block title %}Update Article{% endblock %}
{% block header %}Update Article{% endblock header %}
{% block content %}

        {% csrf_token %}
        {{ form }}
        <button type="submit">Edit article</button>
    </form>
{% endblock %}
